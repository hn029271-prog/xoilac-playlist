name: Update Xoilac M3U

on:
  workflow_dispatch: # Vẫn giữ nút chạy thủ công nếu cần
  schedule:
    - cron: '*/1 * * * *' # Thiết lập chạy tự động cứ mỗi 1 phút / lần

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run script
        run: python main.py

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update M3U playlist every 1 min [skip ci]"
          file_patterns: xoilac_live.m3u
